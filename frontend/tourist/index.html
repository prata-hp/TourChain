    // -------------------------------------------------------------------------
    // --- 3. API & UTILITY FUNCTIONS
    // -------------------------------------------------------------------------
    const appContainer = document.getElementById('app-container');
    const navContainer = document.getElementById('bottom-nav-container');
    const getT = () => translations[state.language] || translations['en'];

    async function apiRequest(endpoint, method = "GET", body = null) {
    try {
        const options = { method, headers: { "Content-Type": "application/json" } };
        if (state.currentUser && state.currentUser.token) {
            options.headers['Authorization'] = `Bearer ${state.currentUser.token}`;
        }
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(`${API_URL}${endpoint}`, options);
        if (!res.ok) throw new Error(await res.text() || 'API Error');

        const text = await res.text();
        return text ? JSON.parse(text) : {}; // Safely handles empty responses

    } catch (err) {
        console.error('API Request Failed:', err);
        throw err;
    }
}

    function showQrModal(journeyData) {
        const t = getT();
        document.getElementById('qr-modal-title').innerText = t.qrCodeTitle;
        document.getElementById('qr-modal-subtitle').innerText = t.qrCodeSubtitle;
        document.getElementById('qr-modal-tx-label').innerText = t.txHash;
        document.getElementById('qr-modal-tx-hash').innerText = journeyData.txHash;
        document.querySelector('#qr-modal button').innerText = t.close;

        const qrCanvas = document.getElementById('qr-canvas');
        new QRious({
            element: qrCanvas,
            value: `${window.location.origin}/verify?token=${journeyData.qrCodeToken}`,
            size: 200,
            padding: 10,
        });

        const modal = document.getElementById('qr-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function hideQrModal() {
        const modal = document.getElementById('qr-modal');
        modal.classList.remove('flex');
        modal.classList.add('hidden');
    }

function renderDestinationBlock(id) {

                Add another place
            </button>
        </div>
    `;
}

function addPlaceBlock(destinationId, isFirst = false) {
    const placeHTML = `
        <div class="flex items-center space-x-2">
            <input type="text" placeholder="Place Name" class="place-name-input flex-grow min-w-0 p-2 bg-white dark:bg-gray-700 rounded-md">
            <input type="text" placeholder="Notes (Optional)" class="place-notes-input flex-grow min-w-0 p-2 bg-white dark:bg-gray-700 rounded-md">
            ${!isFirst ? `<button type="button" onclick="this.parentElement.remove()" class="p-2 text-red-500 hover:bg-red-100 dark:hover:bg-red-900/50 rounded-full"><i data-lucide="minus-circle" class="w-5 h-5"></i></button>` : '<div class="w-9 h-9"></div>'}
        </div>
    `;
    return placeHTML;
}

function addPlaceToUI(destinationId) {
    const placesContainer = document.querySelector(`#destination-${destinationId} .places-container`);
    const newPlaceHTML = addPlaceBlock(destinationId, false);
    placesContainer.insertAdjacentHTML('beforeend', newPlaceHTML);
    lucide.createIcons(); // Re-render icons to include the new one
}

                            <button onclick="handleAddFamilyMember()" class="w-full bg-indigo-500 text-white font-semibold py-2 rounded-lg hover:bg-indigo-600">
                                Add Member
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    lucide.createIcons();
}

    async function renderEditItineraryPage(itineraryId) {
    try {
        // 1. Fetch the specific itinerary data from the backend
        const itineraryToEdit = await apiRequest(`/itineraries/${itineraryId}`);

        // 2. Render the "Create New Trip Plan" page
        renderNewItineraryPlanPage();

        // 3. Wait a tiny moment for the HTML to be in the DOM
        await new Promise(resolve => setTimeout(resolve, 0));

        // 4. Populate the form with the fetched data
        document.getElementById('trip-name').value = itineraryToEdit.name;
        document.getElementById('starting-city').value = itineraryToEdit.startingCity;
        // ... you would also need to loop through destinations and places to create and fill those inputs

        // 5. Change the "Save" button to an "Update" button
        const saveButton = document.querySelector('#itinerary-form button[onclick^="handleSave"]');
        saveButton.innerText = 'Update Itinerary Draft';
        saveButton.onclick = () => handleUpdateItinerary(itineraryId);

    } catch (err) {
        alert("Could not load itinerary for editing.");
    }
}

  async function handleUpdateItinerary(itineraryId) {
    try {
        // This logic is now complete and correctly gathers all data from the form
        const tripName = document.getElementById('trip-name').value;
        const startingCity = document.getElementById('starting-city').value;
        
        const destinationElements = document.querySelectorAll('#destinations-container > div');
        const destinations = Array.from(destinationElements).map(destEl => {
            const city = destEl.querySelector('.destination-city-input').value;
            const placeElements = destEl.querySelectorAll('.places-container .flex');
            
            const places = Array.from(placeElements).map(placeEl => ({
                name: placeEl.querySelector('.place-name-input').value,
                notes: placeEl.querySelector('.place-notes-input').value
            })).filter(p => p.name); // Only include places that have a name

            return { city, places };
        }).filter(d => d.city); // Only include destinations that have a city name

        const updatedDraftData = {
            name: tripName,
            startingCity,
            destinations
        };

        // It sends a PUT request to the specific itinerary's URL
        await apiRequest(`/itineraries/${itineraryId}`, 'PUT', updatedDraftData);
        
        alert("Itinerary updated successfully!");
        showPage('plan'); // Go back to the list of plans

    } catch (err) {
        alert("Failed to update itinerary. Please check the console for details.");
        console.error("Update Itinerary Failed:", err);
    }
}

    // In your index.html


 async function handleAddFamilyMember() {
    const nameInput = document.getElementById('new-member-name');
    const ageInput = document.getElementById('new-member-age');
    
    const fullName = nameInput.value;
    const age = ageInput.value;

    if (!fullName || !age) {
        alert("Please provide both a name and an age.");
        return;
    }

    try {
        const newMemberData = { fullName, age: parseInt(age) };
        await apiRequest('/profile/members', 'POST', newMemberData);
        
        // Refresh the profile data from the server to show the new member
        const updatedProfile = await apiRequest('/profile/me');
        state.profile = updatedProfile.profile;
        
        // Re-render the account page with the updated list
        renderAccountPage();
        
    } catch (err) {
        alert("Failed to add family member.");
        console.error(err);
    }
}

async function handleRemoveFamilyMember(memberId) {
    if (confirm("Are you sure you want to remove this family member?")) {
        try {
            await apiRequest(`/profile/members/${memberId}`, 'DELETE');
            
            // Optimistically remove the member from the local state
            state.profile.familyMembers = state.profile.familyMembers.filter(m => m._id !== memberId);
            
            // Re-render the page to reflect the change
            renderAccountPage();

        } catch (err) {
            alert("Failed to remove family member.");
            console.error(err);
        }
    }
}    

// In index.html
async function initializeAppState() {
    try {
        const [profileData, draftsData] = await Promise.all([
            apiRequest('/profile/me'),
            apiRequest('/itineraries')
        ]);

        // --- THIS IS THE FIX ---
        // The backend sends the profile directly, not nested.
        state.profile = profileData; 
        state.itineraryDrafts = draftsData.drafts || [];
        
        try {
            const journeyData = await apiRequest('/journeys/active');
            if (journeyData && journeyData.journey) {
                state.activeJourney = journeyData.journey;
                state.activeJourneyData = {
                    qrCodeToken: journeyData.journey.qrCodeToken,
                    txHash: journeyData.journey.blockchainTxHashes.start
                };
            }
        } catch (journeyError) {
            console.log("No active journey found, which is normal.");
            state.activeJourney = null;
        }
        
        showPage('home');

    } catch (error) {
        console.error("Critical session error, clearing session.", error);
        localStorage.removeItem('tourchain-user');
        state.currentUser = null;
        showPage('auth');
    }
}

    async function handleLogin() {
    const role = document.getElementById('role-select').value;
    const phone = document.getElementById('login-phone').value;
    const password = document.getElementById('login-password').value;

    if (role === 'Admin') {
        window.location.href = ADMIN_APP_URL;
        return;
    }

    if (!phone || !password) {
        alert('Please enter phone and password.');
        return;
    }

    try {
        // 'data' will be the exact object your controller sends: { _id, phone, role, token }
        const data = await apiRequest('/auth/login', 'POST', { phone, password });

        // We assign this entire object to state.currentUser
        state.currentUser = data;
        localStorage.setItem('tourchain-user', JSON.stringify(data));

        // Now, initializeAppState() will be able to find state.currentUser.token
        await initializeAppState();

    } catch (err) {
        alert('Login failed. Please check your credentials.');
    }
}

    async function handleActivateTrip() {
        const draftId = document.getElementById('draft-select').value;
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;

        if (!draftId || !startDate || !endDate) {
            alert('Please select a draft and set both start and end dates.');
            return;
        }

        try {
            const journeyData = await apiRequest('/journeys/start', 'POST', {
                itineraryId: draftId, 
                startDate, 
                endDate, 
                members: [], // Placeholder for member selection
            });

            // The backend returns the full active journey object
            state.activeJourney = journeyData.journey;
            
            // We need to store QR and TxHash separately for the modal
            state.activeJourneyData = {
                qrCodeToken: journeyData.journey.qrCodeToken,
                txHash: journeyData.journey.blockchainTxHashes.start
            };

            showQrModal(state.activeJourneyData);
            showPage('home');
        } catch (err) {
            alert('Failed to activate trip. Please try again.');
        }
    }
    
    async function handleEndJourney() {
        if (confirm("Are you sure you want to end the current journey?")) {
            try {
                await apiRequest(`/journeys/${state.activeJourney._id}/end`, 'POST');
                state.activeJourney = null;
                state.activeJourneyData = null;
                alert("Journey successfully ended.");
                showPage('home');
            } catch (err) {
                alert('Failed to end journey. Please try again.');
            }
        }
    }

    async function handlePanic() {
        if (!state.activeJourney) {
            alert("Cannot trigger panic: No active journey is registered.");
            return;
        }
        if (confirm("🚨 WARNING: This will send an alert to authorities. Proceed?")) {
            try {
                await apiRequest(`/journeys/${state.activeJourney._id}/panic`, 'POST');
                alert("Panic alert sent! Help is on the way.");
                // Optionally update UI to show panic state
                showPage('home');
            } catch (err) {
                alert('Failed to send panic alert. Please try again.');
            }
        }
    }

        try {

    async function handleSaveItinerary() {
    try {
        // --- THIS IS THE FIX ---
        // The IDs now correctly match the HTML input fields.
        const tripName = document.getElementById('trip-name').value;
        const startingCity = document.getElementById('starting-city').value;

        if (!tripName || !startingCity) {
            alert("Please provide a Trip Name and a Starting City.");
            return;
        }

        const destinationElements = document.querySelectorAll('#destinations-container > div');
        const destinations = Array.from(destinationElements).map(destEl => {
            const city = destEl.querySelector('.destination-city-input').value;
            const placeElements = destEl.querySelectorAll('.places-container .flex');
            
            const places = Array.from(placeElements).map(placeEl => {
                return {
                    name: placeEl.querySelector('.place-name-input').value,
                    notes: placeEl.querySelector('.place-notes-input').value
                };
            }).filter(p => p.name);

            return { city, places };
        }).filter(d => d.city);

        const newDraftData = {
            name: tripName,
            startingCity,
            destinations
        };

        await apiRequest('/itineraries', 'POST', newDraftData);
        alert(`Itinerary Draft "${tripName}" saved successfully!`);
        showPage('plan');

    } catch (err) {
        alert('Failed to save itinerary. Please check the console for details.');
        console.error("Save Itinerary Failed:", err);
    }
}


    const pageRenderers = {
        splash: renderSplashPage,
        languageSelect: renderLanguageSelectPage,
        auth: renderAuthPage,
        home: renderHomePage,
        plan: renderPlanPage,
        active: renderActivePage,
        account: renderAccountPage,
        newItinerary: renderNewItineraryPlanPage
    };

    function showPage(pageId) {
        state.currentPage = pageId;
        const renderFunction = pageRenderers[pageId];
        if (renderFunction) {
            appContainer.innerHTML = '<div class="flex items-center justify-center h-full"><i data-lucide="loader-2" class="w-12 h-12 animate-spin text-primary-light"></i></div>';
            setTimeout(async () => {
                await renderFunction();
                lucide.createIcons();
            }, 100);
        }
        renderBottomNav();
    }

    // -------------------------------------------------------------------------
    // --- 6. APP INITIALIZATION
    // -------------------------------------------------------------------------
    function init() {
    const savedLang = localStorage.getItem('tourchain-lang');
    if (savedLang) state.language = savedLang;

    const savedUser = localStorage.getItem('tourchain-user');
    
    // This check now prevents the crash
    if (savedUser && savedUser !== 'undefined') {
        state.currentUser = JSON.parse(savedUser);
        initializeAppState();
    } else {
        // If no user or bad data, clear it and start fresh
        localStorage.removeItem('tourchain-user');
        showPage('splash');
        setTimeout(() => showPage('languageSelect'), 2000);
    }

    if(state.isDarkMode) document.documentElement.classList.add('dark');
    lucide.createIcons();
}

    init();
