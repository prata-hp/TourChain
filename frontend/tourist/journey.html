<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Start Journey | TourChain</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="journey">
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <div class="logo">🧭</div>
        <div class="brand-text">
          <div class="product">TourChain</div>
          <div class="tag muted">Journey proof</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-link" href="index.html">Register</a>
        <a class="nav-link active" href="journey.html">Journey</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="wrap">
      <div class="card card-lg">
        <h1 class="page-title">Start Your Journey</h1>

        <div id="touristInfo" class="info-grid">
          <div class="info-card">
            <div class="info-label">Name</div>
            <div class="info-value" id="touristName">Loading...</div>
          </div>
          <div class="info-card">
            <div class="info-label">Email</div>
            <div class="info-value" id="touristEmail">Loading...</div>
          </div>
          <div class="info-card">
            <div class="info-label">Phone</div>
            <div class="info-value" id="touristPhone">Loading...</div>
          </div>
          <div class="info-card">
            <div class="info-label">Start Date</div>
            <div class="info-value" id="touristStart">Loading...</div>
          </div>
          <div class="info-card">
            <div class="info-label">End Date</div>
            <div class="info-value" id="touristEnd">Loading...</div>
          </div>
        </div>

        <div class="actions">
          <button id="startJourneyBtn" class="btn btn-primary large">🚀 Start Journey</button>
        </div>

        <div id="journeyResponse" class="response-box" style="display:none;">
          <div class="response-row"><strong>Blockchain TxHash:</strong> <span id="txHash"></span></div>
          <div class="response-row"><strong>Journey Valid Until:</strong> <span id="validUntil"></span></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap muted small">TourChain • Demo prototype</div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
